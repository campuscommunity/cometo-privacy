<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cometo – Official Policy Pages</title>

<style>
    :root {
        --text-color: #222;
        --heading-color: #111;
        --link-color: #0066cc;
        --max-width: 900px;
        --brand-color: #0074ff;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text-color);
        background: #f7f9fc;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    header {
        text-align: center;
        padding: 60px 20px 20px;
        background: #fff;
        border-bottom: 1px solid #eee;
    }

    h1 {
        font-size: 32px;
        font-weight: 700;
        color: var(--heading-color);
        margin-bottom: 10px;
    }

    p.subtitle {
        font-size: 18px;
        color: #555;
        margin-top: 0;
    }

    .container {
        width: 100%;
        max-width: var(--max-width);
        margin: auto;
        padding: 40px 20px;
        flex: 1;
        text-align: center;
    }

    .button {
        display: inline-block;
        margin: 12px;
        padding: 14px 26px;
        font-size: 17px;
        color: #fff;
        background: var(--brand-color);
        border-radius: 6px;
        text-decoration: none;
        font-weight: 500;
        transition: 0.2s;
    }

    .button:hover {
        background: #005fcc;
    }

    footer {
        background: #fff;
        border-top: 1px solid #eee;
        padding: 15px;
        text-align: center;
        font-size: 14px;
        color: #666;
    }
</style>

</head>

<body>

<header>
    <h1>Cometo</h1>
    <p class="subtitle">Discover, Connect & Explore Around You</p>
</header>

<div class="container">
    <p style="max-width: 600px; margin: 0 auto 30px;">
        Welcome to the official policy portal for the Cometo mobile application.
        You can find our legal guidelines and privacy practices using the links below.
    </p>

    <a class="button" href="privacy-policy.html">Privacy Policy</a>
    <a class="button" href="terms-and-conditions.html">Terms & Conditions</a>
</div>

<footer>
    &copy; 2025 Cometo. All Rights Reserved.
</footer>

</body>
</html>
